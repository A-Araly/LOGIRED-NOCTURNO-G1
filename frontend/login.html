<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiRed · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="entrada">
    <section class="sala">
      <div>
        <h1>LogiRed</h1>
        <p>Clientes, envíos, conductores y vehículos de LogiRed, en un solo lugar.</p>
      </div>
      <!-- Ilustración: camión de reparto de LogiRed sobre la carretera -->
      <svg class="camion-deco" viewBox="0 0 560 300" aria-hidden="true">
        <!-- ruta punteada entre ciudades -->
        <path d="M30 70 C 150 20, 260 120, 380 60 S 520 40, 540 90" fill="none" stroke="#c9d6ea" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
        <circle cx="30" cy="70" r="6" fill="#f07b1a"/><text x="42" y="60" class="ciudad">Cali</text>
        <circle cx="380" cy="60" r="6" fill="#c9d6ea"/><text x="355" y="45" class="ciudad">Medellín</text>
        <circle cx="540" cy="90" r="6" fill="#f07b1a"/><text x="488" y="118" class="ciudad">Bogotá</text>
        <!-- carretera -->
        <rect x="0" y="262" width="560" height="38" fill="#3a4250"/>
        <g fill="#f07b1a"><rect x="20" y="279" width="50" height="4"/><rect x="120" y="279" width="50" height="4"/><rect x="220" y="279" width="50" height="4"/><rect x="320" y="279" width="50" height="4"/><rect x="420" y="279" width="50" height="4"/><rect x="520" y="279" width="40" height="4"/></g>
        <!-- líneas de velocidad -->
        <g stroke="#c9d6ea" stroke-width="4" stroke-linecap="round" opacity="0.5"><line x1="20" y1="165" x2="80" y2="165"/><line x1="40" y1="195" x2="110" y2="195"/><line x1="10" y1="225" x2="70" y2="225"/></g>
        <!-- furgón (carga) -->
        <rect x="120" y="130" width="250" height="115" rx="8" fill="#f3f5f8"/>
        <rect x="120" y="130" width="250" height="18" rx="8" fill="#c2570c"/>
        <text x="245" y="200" text-anchor="middle" class="logo-camion">LogiRed</text>
        <text x="245" y="224" text-anchor="middle" class="lema-camion">Envíos seguros</text>
        <!-- cabina -->
        <path d="M370 165 h70 l45 45 v35 h-115 z" fill="#f07b1a"/>
        <path d="M385 178 h48 l32 32 h-80 z" fill="#c6d4ea"/>
        <rect x="474" y="230" width="14" height="8" rx="2" fill="#ffd27a"/>
        <!-- llantas -->
        <g><circle cx="175" cy="250" r="22" fill="#1c2430"/><circle cx="175" cy="250" r="9" fill="#8a94a6"/>
           <circle cx="315" cy="250" r="22" fill="#1c2430"/><circle cx="315" cy="250" r="9" fill="#8a94a6"/>
           <circle cx="440" cy="250" r="22" fill="#1c2430"/><circle cx="440" cy="250" r="9" fill="#8a94a6"/></g>
      </svg>
    </section>

    <section class="acceso">
      <form id="form-login" novalidate>
        <h2>Iniciar sesión</h2>
        <p class="indicacion">Use el email y la contraseña de su cuenta.</p>
        <label class="campo"><span>Email</span>
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label class="campo"><span>Contraseña</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="boton" type="submit">Entrar</button>
        <p class="error-acceso" id="error-login" role="alert"></p>

        <div class="cuentas" id="cuentas" hidden>
          Cuentas de prueba (modo ejemplo):
          <ul>
            <li><button type="button" data-email="admin@empresa.com" data-password="Admin2026*">Administrador</button></li>
            <li><button type="button" data-email="despacho@empresa.com" data-password="Despacho2026*">Despacho</button></li>
            <li><button type="button" data-email="flota@empresa.com" data-password="Flota2026*">Flota</button></li>
          </ul>
        </div>
      </form>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/datos-ejemplo.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const error = document.getElementById('error-login');

    // Si ya hay sesión, ir directo a la página del rol
    const yaEntro = usuarioActual();
    if (yaEntro) location.href = PAGINA_POR_ROL[yaEntro.rol];

    if (MODO === 'ejemplo') {
      const cuentas = document.getElementById('cuentas');
      cuentas.hidden = false;
      cuentas.onclick = (evento) => {
        const b = evento.target.closest('button');
        if (!b) return;
        form.elements.email.value = b.dataset.email;
        form.elements.password.value = b.dataset.password;
      };
    }

    form.onsubmit = async (evento) => {
      evento.preventDefault();
      error.textContent = '';
      const email = form.elements.email.value.trim();
      const password = form.elements.password.value;
      if (!email || !password) {
        error.textContent = 'Escriba el email y la contraseña.';
        return;
      }
      try {
        await iniciarSesion(email, password);
      } catch (e) {
        error.textContent = e.status === 401 ? 'Email o contraseña incorrectos.' : e.message;
      }
    };
  </script>
</body>
</html>
